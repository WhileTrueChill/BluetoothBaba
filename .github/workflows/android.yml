name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BluetoothBaba

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BluetoothBaba/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Initialize Android
        run: npm run tauri android init

      - name: Configure stable release build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()
          marker = 'getByName("release") {'
          if marker in text:
              start = text.index(marker)
              brace = text.index("{", start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit("Could not parse Android release build type")
              release = '''getByName("release") {
                  // Preserve Tauri/Rust/JNI runtime classes for reliable startup.
                  signingConfig = signingConfigs.getByName("debug")
                  isMinifyEnabled = false
                  isShrinkResources = false
          }'''
              text = text[:start] + release + text[end:]
              path.write_text(text)
          PY

      - name: Build stable ARM64 release APK
        run: npm run tauri android build -- --release --apk --split-per-abi --target aarch64

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo 'No APK was produced.' >&2; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: cp "${{ steps.apk.outputs.apk }}" BluetoothBaba-ARM64-release.apk

      - name: Upload stable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothBaba-ARM64-release
          path: BluetoothBaba/BluetoothBaba-ARM64-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bluetoothbaba-android-${{ github.run_number }}
          name: BluetoothBaba Android ARM64 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: BluetoothBaba/BluetoothBaba-ARM64-release.apk
